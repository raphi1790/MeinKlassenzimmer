name: Manual Deploy (qual / prod)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.2.3)'
        required: true
      environment:
        description: 'Target environment: qual or prod'
        required: true
        default: 'qual'

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }} from ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install firebase-tools (global)
        run: npm install -g firebase-tools@latest

      - name: Install dependencies
        run: |
          npm ci
        working-directory: client

      - name: Build (if applicable)
        run: |
          npm run build --if-present
        working-directory: client

      - name: Deploy to qual
        if: ${{ inputs.environment == 'qual' }}
        # This workflow expects an environment-scoped secret named `FIREBASE_SA` to be set
        # on the `qual` environment in GitHub (Settings → Environments → qual → Secrets).
        # Add `FIREBASE_PROJECT_ID` to the `qual` Environment containing the Firebase project ID as Environment Variable
        env:
          SA_JSON: ${{ secrets.FIREBASE_SA }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          echo "$SA_JSON" > $GITHUB_WORKSPACE/qual-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS="$GITHUB_WORKSPACE/qual-sa.json"
          npx firebase-tools@latest deploy --project "$PROJECT_ID"  --only hosting

      - name: Deploy to prod
        if: ${{ inputs.environment == 'prod' }}
        # This workflow expects an environment-scoped secret named `FIREBASE_SA` to be set
        # on the `prod` environment in GitHub (Settings → Environments → prod → Secrets).
        # Add `FIREBASE_PROJECT_ID` to the `prod` Environment containing the Firebase project ID as Environment Variable
        env:
          SA_JSON: ${{ secrets.FIREBASE_SA }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          echo "$SA_JSON" > $GITHUB_WORKSPACE/prod-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS="$GITHUB_WORKSPACE/prod-sa.json"
          npx firebase-tools@latest deploy --project "$PROJECT_ID"  --only hosting

      - name: Finished
        run: echo "Deployment job finished. Check Actions logs and Environments for approvals." 
