name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'qual'
        type: choice
        options:
          - qual
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Determine deployment configuration
        id: env
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          
          if [[ "$ENVIRONMENT" == "qual" ]]; then
            echo "environment=qual" >> $GITHUB_OUTPUT
            echo "firebase_project=meinklassenzimmer-qual" >> $GITHUB_OUTPUT
            echo "build_config=qual" >> $GITHUB_OUTPUT
          else
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "firebase_project=meinklassenzimmer" >> $GITHUB_OUTPUT
            echo "build_config=production" >> $GITHUB_OUTPUT
          fi
          
          # Get current git tag/version
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "unknown")
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build application
        working-directory: ./client
        run: npm run build -- --configuration=${{ steps.env.outputs.build_config }}
        env:
          NODE_ENV: production

      - name: Login to Firebase
        run: |
          npx firebase-tools login:ci \
            --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project ${{ steps.env.outputs.firebase_project }} \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --message "Version ${{ steps.env.outputs.version }} - Deployment from GitHub Actions"

      - name: Create deployment summary
        if: success()
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.env.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Firebase Project**: ${{ steps.env.outputs.firebase_project }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Config**: ${{ steps.env.outputs.build_config }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Application deployed successfully! 🎉" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.env.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
