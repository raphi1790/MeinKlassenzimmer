<div class="container-fluid">
  <div class="row">
    <!-- Timer Configuration Panel -->
    <div class="col-md-5">
      <div class="column1">
        <div class="input-form-container">
          <mat-card>
            <mat-card-header>
              <mat-card-title-group>
                <mat-card-title>
                  <h4>Timer einstellen</h4>
                </mat-card-title>
              </mat-card-title-group>
            </mat-card-header>
            
            <mat-card-content>
              <form [formGroup]="timerForm" class="timer-form">
                <mat-form-field>
                  <mat-label>Minuten</mat-label>
                  <input matInput 
                         type="number" 
                         formControlName="minutes"
                         min="0"
                         aria-label="Anzahl Minuten">
                </mat-form-field>

                <mat-form-field>
                  <mat-label>Sekunden</mat-label>
                  <input matInput 
                         type="number" 
                         formControlName="seconds"
                         min="0"
                         max="59"
                         aria-label="Anzahl Sekunden">
                </mat-form-field>
              </form>
            </mat-card-content>

            <mat-card-actions>
              <button mat-raised-button 
                      color="accent" 
                      (click)="setTime()"
                      [disabled]="timerForm.invalid"
                      aria-label="Timer einstellen">
                Timer stellen
              </button>
            </mat-card-actions>

            <mat-card-footer>
              <div class="preset-label">Schnellauswahl:</div>
              <mat-chip-set aria-label="Vordefinierte Timer">
                <mat-chip 
                  *ngFor="let preset of presets"
                  (click)="setPresetTime(preset.seconds)"
                  color="primary">
                  {{ preset.label }}
                </mat-chip>
              </mat-chip-set>
            </mat-card-footer>
          </mat-card>
        </div>
      </div>
    </div>

    <!-- Timer Display Panel -->
    <div class="col-md-7">
      <div class="column2">
        <div class="timer">
          <mat-card>
            <mat-card-header>
              <mat-card-title-group>
                <mat-card-title>
                  <h4>Timer</h4>
                </mat-card-title>
              </mat-card-title-group>
            </mat-card-header>

            <mat-card-content class="timer-content">
              <countdown #countdown 
                         [config]="config || {format: 'mm:ss'}" 
                         (event)="timesUp($event)"
                         class="timer-display">
                $!m!:$!s!
              </countdown>
            </mat-card-content>

            <mat-card-actions class="timer-actions">
              <button mat-raised-button 
                      color="primary" 
                      (click)="start()"
                      [disabled]="isTimerRunning"
                      aria-label="Timer starten">
                Start
              </button>
              <button mat-raised-button 
                      (click)="pause()"
                      [disabled]="isTimerPaused || isTimerReady"
                      aria-label="Timer pausieren">
                Pause
              </button>
              <button mat-raised-button 
                      color="accent"
                      (click)="resetTimer()"
                      aria-label="Timer zurücksetzen">
                Zurücksetzen
              </button>
            </mat-card-actions>

            <mat-card-footer class="audio-control">
              <mat-slide-toggle 
                [(ngModel)]="isAudioEnabled"
                aria-label="Ton bei Timer-Ende">
                Ton bei Ende
              </mat-slide-toggle>
            </mat-card-footer>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
